<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>blog · the justin zone</title>
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="nav visible pinned" id="nav">
        <a href="index.html"><img src="pfp.png" alt="Justin" /></a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="https://github.com/JustinSUF">GitHub</a>
            <a href="https://x.com/atjustintwt">Twitter</a>
            <a href="https://www.tiktok.com/@atjustin06">TikTok</a>
            <a href="https://discord.com/users/762313184287653889">Discord</a>
        </div>
    </div>

    <main class="page">
        <header class="page-header">
            <h1>blog</h1>
            <p>notes, devlogs, and writing.</p>
        </header>

        <ul class="post-list" id="postList">
            <li class="post-list-empty">loading…</li>
        </ul>
    </main>

    <script>
        fetch("posts/posts.json", { cache: "no-cache" })
            .then(r => r.json())
            .then(posts => {
                const list = document.getElementById("postList");
                if (!posts.length) {
                    list.innerHTML = '<li class="post-list-empty">no posts yet.</li>';
                    return;
                }
                posts.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                list.innerHTML = posts.map(p => `
                    <li class="post-item">
                        <a href="post.html?slug=${encodeURIComponent(p.slug)}">
                            <div class="post-item-head">
                                <h2>${escapeHtml(p.title || p.slug)}</h2>
                                <span>${escapeHtml(p.date || "")}</span>
                            </div>
                            ${p.summary ? `<p>${escapeHtml(p.summary)}</p>` : ""}
                        </a>
                    </li>
                `).join("");
            })
            .catch(err => {
                document.getElementById("postList").innerHTML =
                    '<li class="post-list-empty">couldn\'t load posts.</li>';
                console.error(err);
            });

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }
    </script>
</body>

</html>
