<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>post · the justin zone</title>
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<body>
    <div class="nav visible pinned" id="nav">
        <a href="index.html"><img src="pfp.png" alt="Justin" /></a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="https://github.com/JustinSUF">GitHub</a>
            <a href="https://x.com/atjustintwt">Twitter</a>
            <a href="https://www.tiktok.com/@atjustin06">TikTok</a>
            <a href="https://discord.com/users/762313184287653889">Discord</a>
        </div>
    </div>

    <main class="page">
        <a class="back-link" href="blog.html">‹ back to blog</a>
        <article class="post" id="post">
            <p class="post-status">loading…</p>
        </article>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const slug = params.get("slug");
        const post = document.getElementById("post");

        if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
            post.innerHTML = '<p class="post-status">no post specified.</p>';
        } else {
            Promise.all([
                fetch(`posts/${slug}.md`, { cache: "no-cache" }).then(r => {
                    if (!r.ok) throw new Error("not found");
                    return r.text();
                }),
                fetch("posts/posts.json", { cache: "no-cache" }).then(r => r.json()).catch(() => [])
            ]).then(([md, list]) => {
                const meta = list.find(p => p.slug === slug);
                const html = DOMPurify.sanitize(marked.parse(md));
                const header = meta
                    ? `<header class="post-meta"><span>${escapeHtml(meta.date || "")}</span></header>`
                    : "";
                post.innerHTML = header + html;
                if (meta && meta.title) document.title = `${meta.title} · the justin zone`;
            }).catch(() => {
                post.innerHTML = '<p class="post-status">post not found.</p>';
            });
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }
    </script>
</body>

</html>
